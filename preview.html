<!doctype html><html><head><meta charset='utf-8'><style>
@page{size:A4 portrait;margin:0} body{margin:0;background:white;font-family:Arial,sans-serif}.page{width:210mm;min-height:297mm;box-sizing:border-box;padding:12mm 17.5mm}.head{height:25mm}.lk-dayplan-wrap{width:100%;border:.35mm solid #444;border-radius:4mm;overflow:hidden;box-sizing:border-box;background:#fff}.lk-dayplan-head{display:grid;grid-template-columns:28mm minmax(0,1fr) 16mm;min-height:9mm;background:#eef6fb;border-bottom:.3mm solid #555;font-size:11pt;font-weight:600;text-align:center}.lk-dayplan-head>div{display:flex;align-items:center;justify-content:center;padding:1mm;border-right:.25mm solid #666}.lk-dayplan-head>div:last-child{border-right:0}.lk-dayplan-days{display:block}.lk-dayplan-day{position:relative;display:block;min-height:0!important;height:auto!important;padding-left:28mm;border-bottom:.3mm solid #555;break-inside:avoid;background:#fff}.lk-dayplan-day:last-child{border-bottom:0}.lk-dayplan-dayname{position:absolute;left:0;top:0;bottom:0;width:28mm;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:1.2mm 1mm;border-right:.3mm solid #555;background:#fff;font-size:13.5pt;font-weight:500;text-align:center}.lk-dayplan-taskarea{min-width:0;width:100%;display:block;background:#fff}.lk-dayplan-group{position:relative;display:block;min-width:0;min-height:0!important;height:auto!important;padding-left:12.5mm;border-bottom:.22mm solid #c8c8c8}.lk-dayplan-group:last-child{border-bottom:0}.lk-dayplan-material{position:absolute;left:0;top:0;bottom:0;width:12.5mm;box-sizing:border-box;display:flex;align-items:center;justify-content:center;min-width:0;padding:.35mm .55mm;border-right:.2mm solid #d1d1d1;background:#fff}.lk-dayplan-group-rows{min-width:0;display:block;height:auto!important;min-height:0!important}.lk-dayplan-row{display:grid;grid-template-columns:minmax(0,1fr) 16mm;height:7.6mm!important;min-height:7.6mm!important;max-height:7.6mm!important;box-sizing:border-box;border-bottom:.22mm solid #c8c8c8}.lk-dayplan-row:last-child{border-bottom:0}.a{display:flex;align-items:center;padding:0 2mm;font-size:12pt}.done{border-left:.2mm solid #777;display:flex;align-items:center;justify-content:center}.c{width:4mm;height:4mm;border:.3mm solid #555;border-radius:50%}.d{background:#fff9e4}.m{background:#eaf7ff}.x{background:#f7f7f7}.cover{width:7.8mm;height:9.2mm;background:#ffe867;border:1px solid #999;display:grid;place-items:center;font-size:7pt}
</style></head><body><div class='page'><div class='head'><h1 style='text-align:center'>Wochenplan</h1></div><div class='lk-dayplan-wrap'><div class='lk-dayplan-head'><div>Tag</div><div>Aufgaben</div><div>Erledigt</div></div><div class='lk-dayplan-days'>
<script>
const days=[['Montag',[['D','S. 16','c'],['D','Montag: LZK Deutsch',''],['M','S. 18','c']]],['Dienstag',[['D','S. 17','c'],['M','S. 19','c']]],['Mittwoch',[['D','S. 18','c'],['M','S. 20','c']]],['Donnerstag',[['D','S. 19','c'],['M','S. 22','c']]],['Freitag',[['D','S. 20','c'],['D','★ S. 21',''],['M','S. 23','c'],['M','★ S. 21',''],['X','Lerne das Gedicht von S. 16 auswendig','']]]];
for(const [day,items] of days){document.write(`<section class='lk-dayplan-day'><div class='lk-dayplan-dayname'>${day}</div><div class='lk-dayplan-taskarea'>`); for(const it of items){document.write(`<div class='lk-dayplan-group'><div class='lk-dayplan-material'>${it[2]?`<div class='cover'>Buch</div>`:''}</div><div class='lk-dayplan-group-rows'><div class='lk-dayplan-row'><div class='a ${it[0]=='D'?'d':it[0]=='M'?'m':'x'}'>${it[1]}</div><div class='done'><span class='c'></span></div></div></div></div>`)} document.write(`</div></section>`)}
</script></div></div></div></body></html>
